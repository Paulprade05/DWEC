<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8 - Diferencia de Arrays</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 480px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .nota {
            font-size: 14px;
            color: #555;
            margin-top: -6px;
        }
    </style>
</head>

<body>
    <h1>Ejercicio 8: Diferencia de Arrays</h1>

    <form id="formulario">
        <label for="listaA">Primera lista (separada por comas):</label>
        <input type="text" id="listaA" value="1, 2, 2, 2, 3" required>
        <label for="listaB">Lista b (valores a eliminar):</label>
        <input type="text" id="listaB" value="2" required>
        <span class="nota">Ejemplos: [1,2] y [1] da [2]; [1,2,2,2,3] y [2] da [1,3]</span>
        <button type="submit">Calcular diferencia</button>
    </form>

    <script src="index.js"></script>
</body>

</html>

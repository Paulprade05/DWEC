<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Persistencia Multiplicativa</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 450px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .nota {
            font-size: 14px;
            color: #555;
            margin-top: -6px;
        }
    </style>
</head>

<body>
    <h1>Ejercicio 6: Persistencia Multiplicativa</h1>
    
    <form id="formulario">
        <label for="numero">Introduce un número positivo:</label>
        <input type="number" id="numero" value="39" min="0" required>
        <span class="nota">Ejemplos: 39 (da 3), 999 (da 4), 4 (da 0)</span>
        <button type="submit">Calcular persistencia</button>
    </form>

    <script src="index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Ordenar Dígitos</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 480px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .nota {
            font-size: 14px;
            color: #555;
            margin-top: -6px;
        }
    </style>
</head>

<body>
    <h1>Ejercicio 9: Dígitos en Orden Descendente</h1>

    <form id="formulario">
        <label for="numero">Introduce un número entero no negativo:</label>
        <input type="number" id="numero" value="42145" min="0" required>
        <span class="nota">Ejemplos: 42145 da 54421; 145263 da 654321</span>
        <button type="submit">Reordenar dígitos</button>
    </form>

    <script src="index.js"></script>
</body>

</html>

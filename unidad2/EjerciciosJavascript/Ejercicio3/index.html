<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Número Menos Repetido</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 450px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Ejercicio 3: Número Menos Repetido</h1>
    
    <form id="formulario">
        <label for="numeros">Introduce números separados por comas:</label>
        <input type="text" id="numeros" value="1, 2, 3, 4, 2, 4, 3, 3, 1, 5, 6, 7" required>
        <button type="submit">Calcular</button>
    </form>

    <script src="index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 10 - bits a uno</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 480px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .nota {
            font-size: 14px;
            color: #555;
            margin-top: -6px;
        }
    </style>
</head>

<body>
    <h1>ejercicio 10: bits a uno en binario</h1>

    <form id="formulario">
        <label for="numero">introduce un numero decimal:</label>
        <input type="number" id="numero" value="1234" required>
        <span class="nota">ejemplo: 1234 es 10011010010 en binario, asi que da 5</span>
        <button type="submit">contar bits</button>
    </form>

    <script src="index.js"></script>
</body>

</html>

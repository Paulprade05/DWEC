<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 - Elementos Únicos</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 450px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .nota {
            font-size: 14px;
            color: #555;
            margin-top: -6px;
        }
    </style>
</head>

<body>
    <h1>Ejercicio 5: Elementos Únicos (Sin Repetidos)</h1>
    
    <form id="formulario">
        <label for="elementos">Introduce elementos separados por comas (números o palabras):</label>
        <input type="text" id="elementos" value="1, hola, 2, 1, hola, 3, mundo, 2, mundo" required>
        <span class="nota">Ejemplo híbrido: 1, hola, 2, 1, hola, 3, mundo, 2, mundo</span>
        <button type="submit">Eliminar repetidos</button>
    </form>

    <script src="index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

  <title>Abrir Ventana Centrada</title>
</head>

<body>

  <button id="btnCerrar">Cerrar</button>

  <script>
    document.getElementById('btnAbrir').addEventListener('click', () => {
      gestor.abrirCentrada();

      gestor.cerrar();
    });
  </script>

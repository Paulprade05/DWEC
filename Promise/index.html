<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let promise = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve("Success");
            }, 2000);
            setTimeout(() => {
                reject("Error");
            }, 2000);           
        });

        promise.then((message) => {
            console.log(message);
        }).catch((error) => {
            console.log(error);
        });  


    </script>
</head>
<body>
    
</body>
</html>
